<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b132b" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Jotay — Mon portefeuille</title>
  <style>
    :root { --bg:#0b132b; --card:#1c2541; --acc:#5bc0be; --txt:#f4f7f5; --mut:#9aa7bd; --bad:#e06c75; }
    * { box-sizing:border-box; } body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
    .wrap { max-width:440px; margin:0 auto; padding:20px 16px 40px; }
    h1 { font-size:20px; margin:8px 0 16px; } .card { background:var(--card); border-radius:14px; padding:18px; margin:12px 0; }
    .bal { font-size:34px; font-weight:700; } .mut { color:var(--mut); font-size:13px; }
    input { width:100%; padding:14px; border-radius:10px; border:1px solid #33415c; background:#0f1b3a; color:var(--txt); font-size:16px; }
    button { width:100%; padding:14px; border:0; border-radius:10px; background:var(--acc); color:#04252b; font-weight:700; font-size:16px; margin-top:12px; }
    button[disabled] { opacity:.5; } .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #263257; }
    .banner { background:#3a2f10; color:#f0d58a; border-radius:10px; padding:10px 12px; font-size:13px; margin:10px 0; }
    .hidden { display:none; } .err { color:var(--bad); font-size:13px; min-height:18px; margin-top:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Jotay — Mon portefeuille</h1>
    <div id="offline" class="banner hidden">Hors ligne — solde peut-être daté, actions désactivées.</div>

    <section id="step-phone" class="card">
      <p class="mut">Entrez votre numéro pour recevoir un code par WhatsApp.</p>
      <input id="msisdn" type="tel" inputmode="tel" placeholder="+221 7X XXX XX XX" autocomplete="tel" />
      <div class="err" id="err-phone"></div>
      <button id="btn-otp">Recevoir le code</button>
    </section>

    <section id="step-code" class="card hidden">
      <p class="mut">Code envoyé par WhatsApp. Saisissez-le ci-dessous.</p>
      <input id="code" type="text" inputmode="numeric" maxlength="8" placeholder="Code à 6 chiffres" />
      <div class="err" id="err-code"></div>
      <button id="btn-verify">Valider</button>
    </section>

    <section id="step-wallet" class="card hidden">
      <div class="bal"><span id="balance">—</span> <span class="mut">FCFA</span></div>
      <div class="mut" id="asof">—</div>
      <div id="frozen" class="banner hidden">Portefeuille gelé — contactez un superviseur.</div>
      <button id="btn-refund">Demander le remboursement</button>
      <div class="err" id="err-refund"></div>
      <button id="btn-showqr">Afficher mon QR de paiement</button>
      <div id="qrbox" class="hidden" style="text-align:center;margin-top:12px">
        <div id="qrimg"></div>
        <div class="mut" id="qrexp"></div>
      </div>
    </section>

    <section id="history" class="card hidden">
      <div class="mut">Dépenses</div>
      <div id="history-list"></div>
    </section>
  </div>

  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
