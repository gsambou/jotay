<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Jotay — Encaisser (QR)</title>
<style>body{font-family:system-ui,sans-serif;background:#0b132b;color:#f4f7f5;margin:0}
.wrap{max-width:440px;margin:0 auto;padding:20px}input{width:100%;padding:14px;font-size:16px;border-radius:10px;border:1px solid #33415c;background:#0f1b3a;color:#fff}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:#5bc0be;color:#04252b;font-weight:700;font-size:16px}
.out{margin-top:14px;font-size:14px}</style></head>
<body><div class="wrap">
  <h1>Encaisser (QR)</h1>
  <p class="mut">Réseau requis. Le tap NFC nécessite un terminal — voir chap. 20.</p>
  <input id="wallet" placeholder="QR scanné (identifiant opaque)"/>
  <input id="amount" type="number" inputmode="numeric" placeholder="Montant FCFA"/>
  <button id="scan">Scanner le QR</button>
  <button id="charge">Débiter</button>
  <div class="out" id="out"></div>
</div>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
</body></html>
