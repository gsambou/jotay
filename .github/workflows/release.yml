name: release
on:
  push:
    tags: ['v*']
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm sim   # aucune release sans réconciliation exacte
      - name: SBOM (syft)
        uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json }
      - name: Build image API (distroless, non-root)
        run: docker build -f apps/api/Dockerfile -t jotay-api:${{ github.ref_name }} .
      # - name: Push image  (registre privé — secret requis)
